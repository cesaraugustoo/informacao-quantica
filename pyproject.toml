[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "qecc-simulation"
version = "0.1.0"
description = "Quantum Error Correction Codes (QECC) simulation suite and academic seminar suite"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.4,<3",
    "scipy>=1.10,<2",
    "matplotlib>=3.7",
    "pytest>=8.4",
    "pydantic>=2.12.4,<3",
    "torch>=2.10,<3",
    "eigenkit>=1.3.0,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qecc"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
